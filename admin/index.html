<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102d3e" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Staff Console — Sentinel Africa Consulting</title>
    <meta name="description" content="The Sentinel Africa Consulting staff console." />
    <link rel="icon" type="image/jpeg" href="/src/assets/logos/sentinel-logo.jpeg" />
    <link rel="apple-touch-icon" href="/src/assets/logos/sentinel-logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the saved console theme before the page paints, so it never flashes.
      try {
        const saved = localStorage.getItem("sentinel-admin-theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to use the Sentinel Africa staff area.</noscript>
    <script type="module" src="/src/entries/admin.tsx"></script>
  </body>
</html>
